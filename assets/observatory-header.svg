<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Matheus Camargo — Full-stack developer</title>
  <desc id="desc">Cabeçalho escuro inspirado em um observatório, com estrelas, órbitas e acentos em ciano, violeta e dourado.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050712"/>
      <stop offset="0.55" stop-color="#070a16"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="cyanField" cx="0" cy="0" r="1" gradientTransform="translate(164 16) rotate(45) scale(420 310)">
      <stop stop-color="#72ecff" stop-opacity=".19"/>
      <stop offset="1" stop-color="#72ecff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetField" cx="0" cy="0" r="1" gradientTransform="translate(1012 40) rotate(128) scale(420 340)">
      <stop stop-color="#ad8cff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ad8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset=".18" stop-color="#72ecff"/>
      <stop offset=".52" stop-color="#72ecff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#72ecff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#72ecff" stroke-opacity=".055"/>
    </pattern>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="358" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#cyanField)"/>
    <rect width="1200" height="360" fill="url(#violetField)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <g fill="#f5f7fb">
      <circle cx="55" cy="43" r="1.2" opacity=".72"/>
      <circle cx="107" cy="302" r="1.5" opacity=".5"/>
      <circle cx="185" cy="80" r="1" opacity=".48"/>
      <circle cx="321" cy="38" r="1.4" opacity=".72"/>
      <circle cx="430" cy="316" r="1" opacity=".66"/>
      <circle cx="514" cy="61" r="1.2" opacity=".44"/>
      <circle cx="660" cy="322" r="1.5" opacity=".4"/>
      <circle cx="720" cy="45" r="1" opacity=".8"/>
      <circle cx="824" cy="290" r="1.4" opacity=".7"/>
      <circle cx="1108" cy="300" r="1" opacity=".55"/>
      <circle cx="1161" cy="67" r="1.4" opacity=".68"/>
    </g>
    <g fill="#72ecff" filter="url(#softGlow)">
      <circle cx="91" cy="128" r="1.4"/>
      <circle cx="269" cy="284" r="1.2"/>
      <circle cx="576" cy="298" r="1.3"/>
      <circle cx="753" cy="103" r="1.1"/>
      <circle cx="1140" cy="228" r="1.4"/>
    </g>

    <path d="M0 314C212 288 339 335 528 302S845 230 1200 276" fill="none" stroke="#72ecff" stroke-opacity=".12"/>
    <path d="M0 326C221 300 360 348 545 315S850 246 1200 289" fill="none" stroke="#ad8cff" stroke-opacity=".09"/>

    <g transform="translate(996 180)">
      <ellipse rx="146" ry="54" fill="none" stroke="#72ecff" stroke-width="2" stroke-opacity=".74" transform="rotate(-18)"/>
      <ellipse rx="139" ry="52" fill="none" stroke="#ad8cff" stroke-width="2" stroke-opacity=".68" transform="rotate(28)"/>
      <ellipse rx="132" ry="48" fill="none" stroke="#f6d56d" stroke-width="1.7" stroke-opacity=".72" transform="rotate(-58)"/>
      <circle r="46" fill="url(#core)" filter="url(#cyanGlow)"/>
      <circle r="9" fill="#f5f7fb"/>
      <circle cx="-107" cy="-74" r="6" fill="#68f0cb" filter="url(#softGlow)"/>
      <circle cx="117" cy="55" r="5" fill="#ad8cff" filter="url(#softGlow)"/>
      <circle cx="-34" cy="129" r="4.5" fill="#f6d56d" filter="url(#softGlow)"/>
      <path d="M-3-72V-98M-16-85H10" stroke="#f5f7fb" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
    </g>

    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">
      <text x="74" y="66" fill="#72ecff" font-size="17" font-weight="700" letter-spacing="4.5">OBSERVATÓRIO PESSOAL // SIGNAL 014623</text>
      <text x="76" y="115" fill="#8996a9" font-size="12" letter-spacing="2.4">COORD. 23°33'S · SISTEMAS EM OBSERVAÇÃO</text>
      <text x="75" y="185" fill="#f5f7fb" font-family="Inter, 'Segoe UI', sans-serif" font-size="67" font-weight="700" letter-spacing="-1.5">MATHEUS</text>
      <text x="75" y="250" fill="#f5f7fb" font-family="Inter, 'Segoe UI', sans-serif" font-size="67" font-weight="300" letter-spacing="5">CAMARGO</text>
      <text x="78" y="301" fill="#c8d3df" font-size="15" letter-spacing="2.2">FULL-STACK DEVELOPER · SISTEMAS, INTERFACES E IDEIAS EM ÓRBITA</text>
      <text x="78" y="329" fill="#f6d56d" font-size="11" letter-spacing="2.1">STATUS: CAMPO DE IDEIAS ATIVO</text>
      <text x="1080" y="330" fill="#8996a9" font-size="10" letter-spacing="1.8">T-01 · Δt</text>
    </g>

    <path d="M75 83H340" stroke="#72ecff" stroke-opacity=".45"/>
    <path d="M353 83H411" stroke="#ad8cff" stroke-opacity=".52"/>
    <circle cx="425" cy="83" r="3" fill="#f6d56d" filter="url(#softGlow)"/>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="none" stroke="#72ecff" stroke-opacity=".28" stroke-width="2"/>
</svg>
